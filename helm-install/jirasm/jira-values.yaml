jira:
  tomcat:
    scheme: http
    secure: false
    port: 8080

  additionalEnvironmentVariables:
    - name: ATL_TOMCAT_SCHEME
      value: "http"
    - name: ATL_TOMCAT_SECURE
      value: "false"


volumes:
  localHome:
    persistentVolumeClaim:
      create: true
      storageClassName: gp3   # hoặc storageclass EBS khác
      resources:
        requests:
          storage: 20Gi

  sharedHome:
    persistentVolumeClaim:
      create: true
      storageClassName: efs-sc
      resources:
        requests:
          storage: 20Gi

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: alb-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/subnets: subnet-0729b4d3570c85035,subnet-01e7b81b2c34fbaae,subnet-063d005e791e4932f
    alb.ingress.kubernetes.io/tags: "Environment=prod,Application=gitlab-alb"
  hosts:
    - host: jirasm.gitlabonlinecom.click
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
