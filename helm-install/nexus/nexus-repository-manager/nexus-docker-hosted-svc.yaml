apiVersion: v1
kind: Service
metadata:
  name: nexus-docker
  namespace: nexus
spec:
  type: ClusterIP
  ports:
    - name: docker-hosted
      port: 8000        # port bên trong cluster mà Ingress sẽ gọi
      targetPort: 8000  # đúng HTTP port của docker-hosted repo trong Nexus
      protocol: TCP
  selector:
    app.kubernetes.io/name: nexus-repository-manager
    app.kubernetes.io/instance: nexus