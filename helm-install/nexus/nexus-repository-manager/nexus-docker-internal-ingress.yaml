apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-docker-hosted
  namespace: nexus
  annotations:
    alb.ingress.kubernetes.io/group.name: alb-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /v2/_catalog
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/subnets: subnet-0729b4d3570c85035,subnet-01e7b81b2c34fbaae,subnet-063d005e791e4932f
spec:
  ingressClassName: alb
  rules:
    - host: docker-internal.gitlabonlinecom.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-docker
                port:
                  number: 8000
