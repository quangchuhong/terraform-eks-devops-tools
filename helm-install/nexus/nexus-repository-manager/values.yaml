---
# Nexus Repository OSS — install:
#   helm upgrade --install nexus ./helm-install/nexus/nexus-repository-manager -n nexus --create-namespace
#   kubectl apply -f helm-install/nexus/manifests/
statefulset:
  # This is not supported
  enabled: false
deploymentStrategy: Recreate

image:
  # Sonatype Official Public Image
  repository: sonatype/nexus3
  # 3.85.0 on the embedded H2 database (3.71+ has no OrientDB, which is EOL with critical CVEs).
  # The running /nexus-data was created by 3.85.0: do not go back to an older tag.
  tag: 3.85.0
  pullPolicy: IfNotPresent
imagePullSecrets:

nexus:
  # Docker connectors (8000 hosted, 8001 group, 8002 proxy) are exposed by helm-install/nexus/manifests/
  docker:
    enabled: false
  env:
    # Heap + direct memory must stay below resources.limits.memory
    - name: INSTALL4J_ADD_VM_PARAMS
      value: >-
        -Xms2048m -Xmx2048m
        -XX:MaxDirectMemorySize=1536m
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
        -Dnexus.scripts.allowCreation=true
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "true"
  # Not mounted: a subPath mount makes kubelet create /nexus-data/etc as root, and
  # Nexus (uid 200) then cannot create /nexus-data/etc/logback. Set via JVM option above.
  properties:
    override: false
    data:
      nexus.scripts.allowCreation: true
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # The ports should only be changed if the nexus image uses a different port
  nexusPort: 8081

  securityContext:
    runAsUser: 200
    runAsGroup: 200
    fsGroup: 200
  podAnnotations: {}
  # First start (DB init) can take several minutes
  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 20
    failureThreshold: 6
    timeoutSeconds: 10
    path: /
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 6
    timeoutSeconds: 10
    path: /
  hostAliases: []

nameOverride: ""
# Service/Deployment name "nexus" (the docker manifests select on these labels)
fullnameOverride: "nexus"

deployment:
  annotations: {}
  # Give /nexus-data back to the nexus user (uid/gid 200), also for dirs left root-owned
  initContainers:
    - name: fix-permissions
      image: busybox:1.36
      command: ["sh", "-c", "chown -R 200:200 /nexus-data"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: nexus-repository-manager-data
          mountPath: /nexus-data
  postStart:
    command:
  preStart:
    command:
  terminationGracePeriodSeconds: 120
  additionalContainers:
  additionalVolumes:
  additionalVolumeMounts:

ingress:
  enabled: true
  ingressClassName: alb
  # Shares the GitLab ALB (group alb-apps), HTTP only
  annotations:
    alb.ingress.kubernetes.io/group.name: alb-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/subnets: subnet-01e7b81b2c34fbaae, subnet-0729b4d3570c85035, subnet-063d005e791e4932f
  hostPath: /
  hostRepo: nexus.gitlabonlinecom.click

service:
  name: nexus3
  enabled: true
  labels: {}
  annotations: {}
  type: ClusterIP

route:
  enabled: false
  name: docker
  portName: docker
  labels:
  annotations:

nexusProxyRoute:
  enabled: false
  labels:
  annotations:

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: gp3
  storageSize: 20Gi

tolerations: []

config:
  enabled: false
  mountPath: /sonatype-nexus-conf
  data: []

secret:
  enabled: false
  mountPath: /etc/secret-volume
  readOnly: true
  data: []

serviceAccount:
  create: true
  # Must match the IRSA trust in nexus-helm.tf (system:serviceaccount:nexus:nexus)
  name: nexus
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::609320954321:role/eks-nexus-role
