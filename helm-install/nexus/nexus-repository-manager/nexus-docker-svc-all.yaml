apiVersion: v1
kind: Service
metadata:
  name: nexus-docker
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexus-repository-manager
    app.kubernetes.io/instance: nexus
  ports:
    - name: docker-hosted
      port: 8000
      targetPort: 8000
    - name: docker-proxy
      port: 8002
      targetPort: 8002
    - name: docker-all
      port: 8001
      targetPort: 8001