apiVersion: v1
kind: Service
metadata:
  name: nexus-docker-proxy
  namespace: nexus
spec:
  type: ClusterIP
  ports:
    - name: docker-proxy
      port: 8002
      targetPort: 8002
      protocol: TCP
  selector:
    app.kubernetes.io/name: nexus-repository-manager
    app.kubernetes.io/instance: nexus
