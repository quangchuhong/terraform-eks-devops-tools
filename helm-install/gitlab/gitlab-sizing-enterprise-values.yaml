global:
  ingress:
    configureCertmanager: false
    class: alb
    annotations:
      alb.ingress.kubernetes.io/group.name: gitlab-alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/subnets: subnet-0729b4d3570c85035, subnet-01e7b81b2c34fbaae, subnet-063d005e791e4932f

  hosts:
    domain: gitlabonlinecom.click # Thay thế domain của bạn
    https: true

  spec:
    defaultBackend:
      service:
        name: gitlab-webservice-default # This service will be used for the default backend
        port:
          number: 80

# 1. Webservice (UI/API)
gitlab:
  webservice:
    replicas: 5
    resources:
      requests:
        memory: "8Gi"
        cpu: "2"
      limits:
        memory: "16Gi"
        cpu: "4"
    ingress:
      path: /
    service:
      type: NodePort
      port: 8080

# 2. Sidekiq (Background Jobs)
  sidekiq:
    replicas: 6
    resources:
      requests:
        memory: "8Gi"
        cpu: "4"
      limits:
        memory: "16Gi"
        cpu: "8"
    queues:
      default: 1
      pipeline: 4
      mailers: 1

# 3. Gitaly (Git Storage)
  gitaly:
    replicas: 3
    persistence:
      storageClass: "gp3"
      size: "2Ti"
    resources:
      requests:
        memory: "64Gi"
        cpu: "8"
      limits:
        memory: "128Gi"
        cpu: "16"

# 4. PostgreSQL
postgresql:
  production: true
  postgresql:
    maxConnections: 500
  persistence:
    storageClass: "gp3"
    size: "1Ti"
  resources:
    requests:
      memory: "32Gi"
      cpu: "4"
    limits:
      memory: "64Gi"
      cpu: "8"

# 5. Redis
redis:
  master:
    persistence:
      storageClass: "gp3"
      size: "100Gi"
    resources:
      requests:
        memory: "16Gi"
        cpu: "4"
      limits:
        memory: "32Gi"
        cpu: "8"
    config:
      maxmemory: "24gb"
      maxmemory-policy: "allkeys-lru"

# 6. CI/CD Runners
gitlab-runner:
  enabled: true
  gitlabUrl: "https://gitlab.example.com"
  runnerRegistrationToken: "YOUR_RUNNER_REGISTRATION_TOKEN"  # Lấy từ GitLab Admin → Runners
  
  runners:
    config: |
      [[runners]]
        name = "docker-runner"
        url = "https://gitlab.example.com"
        executor = "docker"
        [runners.docker]
          image = "docker:20.10"
          privileged = true
          volumes = ["/cache", "/var/run/docker.sock:/var/run/docker.sock"]
        [runners.cache]
          Type = "s3"
          Shared = true
          [runners.cache.s3]
            BucketName = "gitlab-runner-cache"
            BucketLocation = "us-east-1"

  # Resource sizing minimum
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "1Gi"
      cpu: "1"

  # Autoscaling cơ bản
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

# 7. Monitoring
prometheus:
  enabled: true
  alertmanager:
    persistentVolume:
      storageClass: "gp3"
      size: "50Gi"
  server:
    persistentVolume:
      storageClass: "gp3"
      size: "200Gi"

grafana:
  enabled: true
  persistence:
    storageClass: "gp3"
    size: "50Gi"

# 8. Resource Optimizations
nginx-ingress:
  enabled: false

certmanager:
  install: false
