# GitLab Runner (Kubernetes executor) for GitLab 19.5 (chart gitlab/gitlab 10.5.4).
#   helm repo add gitlab https://charts.gitlab.io && helm repo update
#   helm upgrade --install gitlab-runner gitlab/gitlab-runner --version 0.94.0 \
#     -n gitlab-runner -f helm-install/gitlab-runner/values.yaml
#
# - The runner manager (this Deployment) runs on the normal nodes.
# - Job pods run on the tainted CI node group (eks.tf: ci_agents), shared with the Jenkins agents.
# - Authentication token (glrt-...) of a runner created in the GitLab UI, from the Secret
#   gitlab-runner/gitlab-runner-token (keys runner-token, runner-registration-token = "").
#   Never put the token in this file (public repo).

gitlabUrl: http://gitlab.gitlabonlinecom.click/

image:
  tag: alpine-v19.5.0

concurrent: 10
checkInterval: 3
# Give running jobs time to finish when the runner pod is replaced
terminationGracePeriodSeconds: 3600
unregisterRunners: true

rbac:
  create: true
  # Minimum the Kubernetes executor needs in its own namespace
  rules:
    - resources: ["events"]
      verbs: ["list", "watch"]
    - resources: ["pods"]
      verbs: ["create", "delete", "get", "list", "watch"]
    - resources: ["pods/attach", "pods/exec"]
      verbs: ["create", "delete", "get", "patch"]
    - resources: ["pods/log"]
      verbs: ["get", "list"]
    - resources: ["secrets", "configmaps"]
      verbs: ["create", "delete", "get", "update"]
    - resources: ["serviceaccounts"]
      verbs: ["get"]
    - resources: ["services"]
      verbs: ["create", "get"]

serviceAccount:
  create: true
  name: gitlab-runner

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

runners:
  secret: gitlab-runner-token
  executor: kubernetes
  config: |
    [[runners]]
      # Parallel job requests to GitLab: with 1, long polling delays jobs (runner warning at startup)
      request_concurrency = 4
      [runners.kubernetes]
        namespace = "{{ .Release.Namespace }}"
        image = "alpine:3.22"
        # No privileged job pods: build images with Kaniko/BuildKit rootless, not docker-in-docker
        privileged = false
        allow_privilege_escalation = false
        poll_timeout = 600
        cpu_request = "500m"
        memory_request = "1Gi"
        cpu_limit = "2"
        memory_limit = "4Gi"
        ephemeral_storage_request = "2Gi"
        ephemeral_storage_limit = "20Gi"
        helper_cpu_request = "50m"
        helper_memory_request = "64Mi"
        helper_memory_limit = "256Mi"
        service_cpu_request = "100m"
        service_memory_request = "256Mi"
        service_memory_limit = "1Gi"
        [runners.kubernetes.node_selector]
          workload = "ci-agents"
        [runners.kubernetes.node_tolerations]
          "workload=ci-agents" = "NoSchedule"
        [runners.kubernetes.pod_labels]
          "app.kubernetes.io/part-of" = "gitlab-runner-job"
