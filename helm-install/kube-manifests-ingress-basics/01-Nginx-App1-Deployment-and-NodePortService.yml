apiVersion: apps/v1
kind: Deployment
metadata:
  name: app55-nginx-deployment
  #namespace: dev-vscode
  labels:
    app: app55-nginx-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app55-nginx-02
  template:
    metadata:
      labels:
        app: app55-nginx-02
    spec:
      containers:
        - name: app55-nginx-02
          image: stacksimplify/kubenginx:1.0.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app55-nginx-nodeport-service-02
  #namespace: dev-vscode
  labels:
    app: app55-nginx-02
  annotations:
#Important Note:  Need to add health check path annotations in service level if we are planning to use multiple targets in a load balancer    
    #alb.ingress.kubernetes.io/healthcheck-path: /index.html
spec:
  type: NodePort
  selector:
    app: app55-nginx-02
  ports:
    - port: 80
      targetPort: 80

   