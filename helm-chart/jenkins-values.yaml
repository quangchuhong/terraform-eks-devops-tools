# Jenkins (chart local helm-install/jenkins/jenkins, 5.8.116) trên EKS, ALB Ingress, chỉ HTTP.
# Giá trị phụ thuộc hạ tầng (hostName, jenkinsUrl, subnet ALB) do Terraform truyền vào ở jenkins-helm.tf.
controller:
  # Dùng image mặc định của chart (tag = appVersion của chart)
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  javaOpts: "-Xms512m -Xmx1024m"

  # Lần khởi động đầu cài plugin nên lâu: cho startup probe tối đa 5 phút
  probes:
    startupProbe:
      failureThreshold: 30

  JCasC:
    securityRealm: |-
      local:
        allowsSignup: false
        enableCaptcha: false
        users:
        - id: "${chart-admin-username}"
          name: "admin"
          password: "${chart-admin-password}"
    authorizationStrategy: |-
      loggedInUsersCanDoAnything:
        allowAnonymousRead: false

  ingress:
    enabled: true
    ingressClassName: alb
    path: /
    annotations:
      alb.ingress.kubernetes.io/group.name: alb-apps
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      alb.ingress.kubernetes.io/success-codes: "200-399"
      # "/" trả 403 khi chưa đăng nhập → health check bằng trang /login (200)
      alb.ingress.kubernetes.io/healthcheck-path: /login
      # Gỡ các annotation HTTPS có sẵn trong values.yaml của chart đã vendor
      alb.ingress.kubernetes.io/certificate-arn: null
      alb.ingress.kubernetes.io/ssl-redirect: null
      # alb.ingress.kubernetes.io/subnets: Terraform đặt từ var.subnet_ids
    tls: []

persistence:
  enabled: true
  storageClass: "gp3"
  size: "20Gi"
  accessMode: "ReadWriteOnce"

agent:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
