global:
  edition: ce  # Quan trọng: Chỉ định bản CE
  hosts:
    domain: gitlabonlinecom.click  # Terraform ghi đè bằng var.domain (gitlab-helm.tf)
    https: false  # Chỉ dùng HTTP (ALB nghe cổng 80, không có 443)
  ingress:
    configureCertmanager: false  # TLS không dùng → không cần cert-manager
    name: gitlab-alb-apps
    tls:
      enabled: false
    class: alb
    annotations:
      alb.ingress.kubernetes.io/group.name: alb-apps
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      # Bật HTTPS sau: thêm {"HTTPS":443} vào listen-ports, certificate-arn (ACM của account mới) và ssl-redirect
      # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:<ACCOUNT_ID>:certificate/<ID>"
      # alb.ingress.kubernetes.io/ssl-redirect: "443"
      # Subnet PUBLIC (route 0.0.0.0/0 → IGW) của VPC chạy EKS
      alb.ingress.kubernetes.io/subnets: subnet-0189d8013dc13f181, subnet-012955c7d5094705c, subnet-0c403ad0b306974dc
      alb.ingress.kubernetes.io/tags: "Environment=prod,Application=gitlab-alb"

certmanager-issuer:
  email: quang.hong.0991@gmail.com

# 1. Webservice (UI/API), add them extraEnv fix loi access login qua http
gitlab:
  webservice:
    ingress:
      paths:
        - path: /
          pathType: Prefix
    service:
      port: 8080
      type: ClusterIP
    extraEnv:
      GITLAB_TRUSTED_PROXIES: "0.0.0.0/0,::/0"
      GITLAB_OMNIBUS_CONFIG: |
        nginx['real_ip_trusted_addresses'] = ['0.0.0.0/0', '::/0']
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        rails['relative_url_root'] = '/'
        gitlab_rails['gitlab_rails_env'] = "production"
        gitlab_rails['session_store_secure'] = false  


# 3. Gitaly (Git Storage)
  gitaly:
    persistence:
      storageClass: "gp3"

# 4. PostgreSQL
postgresql:
  production: true
  postgresql:
    maxConnections: 500
  persistence:
    storageClass: "gp3"
    size: "10Gi"
  resources:
    requests:
      memory: "320Mi"
      cpu: "200m"
    limits:
      memory: "640Mi"
      cpu: "400m"

# 5. Redis
redis:
  master:
    persistence:
      storageClass: "gp3"
      size: "500Mi"
    resources:
      requests:
        memory: "450Mi"
        cpu: "500m"
      limits:
        memory: "650Mi"
        cpu: "800m"

  registry:
    ingress:
      paths:
        - path: /registry/*
          pathType: Prefix
    service:
      port: 5000
      type: ClusterIP

  minio:
    ingress:
      paths:
        - path: /minio/*
          pathType: Prefix
    service:
      port: 9000
      type: ClusterIP

# Tắt các components không cần thiết
nginx-ingress:
  enabled: false

# Không cài cert-manager đi kèm chart (chỉ dùng HTTP; khi bật HTTPS dùng ACM trên ALB)
installCertmanager: false

gitlab-pages:
  enabled: false

mattermost:
  enabled: false

prometheus:
  install: false  

alertmanager:
  enabled: false 

gitlab-runner:
  install: false

