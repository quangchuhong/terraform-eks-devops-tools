# GitLab chart 10.x (GitLab 19) trên EKS, ALB Ingress, chỉ HTTP.
# Các giá trị phụ thuộc hạ tầng (domain, subnet ALB, endpoint RDS/Redis, bucket S3,
# IAM role) được Terraform truyền vào ở gitlab-helm.tf; secret tạo ở gitlab-backend.tf.
global:
  edition: ce
  hosts:
    domain: gitlabonlinecom.click  # Terraform ghi đè bằng var.domain
    https: false                   # Chỉ HTTP (ALB nghe cổng 80, không có 443)

  # Chart 10.x mặc định dùng Gateway API + Envoy Gateway → tắt, dùng Ingress của ALB
  gatewayApi:
    enabled: false
    installEnvoy: false

  ingress:
    enabled: true
    provider: aws
    class: alb
    configureCertmanager: false
    tls:
      enabled: false
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: alb-apps
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      # Bật HTTPS sau: thêm {"HTTPS":443} vào listen-ports, certificate-arn (ACM) và ssl-redirect
      # alb.ingress.kubernetes.io/subnets: Terraform đặt từ var.subnet_ids
      alb.ingress.kubernetes.io/tags: "Environment=prod,Application=gitlab-alb"

  # PostgreSQL: Amazon RDS (host do Terraform truyền vào)
  psql:
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgresql-password
      key: postgresql-password

  # Redis: Amazon ElastiCache, mã hoá đường truyền → rediss (host do Terraform truyền vào)
  redis:
    port: 6379
    scheme: rediss
    auth:
      enabled: true
      secret: gitlab-redis-secret
      key: redis-password

  # Object storage: S3 qua IAM role (IRSA) gắn vào mọi ServiceAccount của chart
  serviceAccount:
    enabled: true
    create: true

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-rails-storage
        key: connection
    externalDiffs:
      enabled: true
    terraformState:
      enabled: true
    ciSecureFiles:
      enabled: true
    dependencyProxy:
      enabled: true
    backups:
      objectStorage:
        backend: s3

# Container Registry lưu image trên S3
registry:
  storage:
    secret: gitlab-registry-storage
    key: config

gitlab:
  webservice:
    service:
      type: ClusterIP
  gitaly:
    persistence:
      storageClass: "gp3"
  # Backup: backup-utility --s3tool awscli (IRSA, không cần s3cmd.config)

# Tắt các thành phần không dùng
nginx-ingress:
  enabled: false

installCertmanager: false

gitlab-pages:
  enabled: false

mattermost:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

