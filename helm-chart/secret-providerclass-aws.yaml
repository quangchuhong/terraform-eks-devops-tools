apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nexus-secret-provider # Choose a descriptive name for your SecretProviderClass
  namespace: nexus

spec:
  provider: aws
  secretObjects:
    - data:
        - key: nxrm-ha-dbsecret # The key you want to use within the Kubernetes Secret
          objectName: nexus-db-secret # The name of your secret in AWS Secrets Manager
      secretName: nxrm-ha-dbsecret # The name of the Kubernetes Secret to be created
      type: Opaque # Or kubernetes.io/tls, or kubernetes.io/dockerconfigjson depending on the secret type
  parameters:
    objects: |
      - objectName: "nexus-db-secret" # The name of your secret in AWS Secrets Manager
        objectType: "secretsmanager"
        jmesPath: # Optional: Use JMESPath to extract specific values if your secret is JSON
          - path: "db_user"
            objectAlias: "DB_USERNAME" # Alias for the extracted value
          - path: "db_password"
            objectAlias: "DB_PASSWORD"
          - path: "db_host"
            objectAlias: "DB_HOST"
          - path: "db_name"
            objectAlias: "DB_NAME"
