# Cấu hình Service Account
namespaces:
  nexusNs:
    enabled: true
    name: "nexus"

serviceAccount:
  create: false
  name: nexus-sa

# Cấu hình S3 Blob Store
blobstore:
  s3:
    bucket: ${s3_bucket}
    region: ${aws_region}
    roleArn: ${s3_role_arn}

# Cấu hình Database
database:
  type: postgres
  host: ${db_endpoint}
  name: ${db_name}
  user: ${db_user}
  password: ${db_password}

# Cấu hình Persistence (EFS)
persistence:
  storageClass: efs-sc
  accessMode: ReadWriteMany
  size: 20Gi
  fileSystemId: ${efs_file_system_id}

# Cấu hình Replica để đảm bảo High Availability
replicaCount: 2

resources:
  requests:
    cpu: "500m"
    memory: "500Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoSchedule"

nodeSelector:
  node-type: high-cpu

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "node-type"
              operator: In
              values:
                - "high-cpu"

ingress:
  enabled: true
  name: nexus-ingress
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: alb-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: / 
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/subnets: subnet-0729b4d3570c85035, subnet-01e7b81b2c34fbaae, subnet-063d005e791e4932f
  rules:
    - host: nexus.gitlabonlinecom.click
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: nexus-nxrm-ha
                port:
                  number: 80
  tls: []

