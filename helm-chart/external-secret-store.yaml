apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretstore
  namespace: nexus  # Namespace cài đặt ESO
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1  # Thay đổi region phù hợp
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa  # Tên Service Account
