apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-db-external-secret
  namespace: nexus  # Đảm bảo namespace khớp với ứng dụng
spec:
  refreshInterval: 1h  # Tự động refresh mỗi giờ
  secretStoreRef:
    name: aws-secretstore  # Tên SecretStore đã tạo trước
    kind: SecretStore
  target:
    name: nexus-db-secret  # Tên Kubernetes Secret sẽ được tạo
    creationPolicy: Owner
  data:
  - secretKey: db_name
    remoteRef:
      key: nexus-db-secret
      property: db_name
  - secretKey: db_host
    remoteRef:
      key: nexus-db-secret  # Tên secret trong AWS Secrets Manager
      property: db_host
  - secretKey: db_user
    remoteRef:
      key: nexus-db-secret
      property: db_user
  - secretKey: db_password
    remoteRef:
      key: nexus-db-secret
      property: db_password

